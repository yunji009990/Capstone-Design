<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>다시, 봄 — 관리자</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <a href="/">등록</a><a href="/after">체험 후</a><a href="/admin" class="on">관리자</a>
  </div>

  <div id="login">
    <h1>관리자</h1>
    <div class="card">
      <label>관리자 비밀번호</label>
      <input type="password" id="pw">
      <div class="row" style="margin-top:14px">
        <button id="go">로그인</button>
        <span class="hint" id="loginmsg" style="margin:0"></span>
      </div>
    </div>
  </div>

  <div id="panel" style="display:none">
    <h1>관리자</h1>
    <div class="row" style="margin-bottom:16px">
      <label class="ck" style="margin:0"><input type="checkbox" id="showdel"> 폐기된 세션도 보기</label>
      <div class="grow"></div>
      <button class="ghost" id="reload">새로 고침</button>
      <button class="ghost" id="logout">로그아웃</button>
    </div>

    <div class="card">
      <h2>세션 목록</h2>
      <div id="list"></div>
    </div>

    <div class="card" id="detail" style="display:none"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let pw = sessionStorage.getItem("adminpw") || "";
// 참여자가 적은 글을 화면에서 실행하지 않는다. 따옴표까지 막아야 속성 안에서도 안전하다.
const esc = v => String(v ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || r.status);
  return d;
}
// 비밀번호는 주소에 안 싣는다 — 주소는 기록에 남는다.
const auth = () => ({ headers: { "X-Admin-Pw": pw } });

async function login(p) {
  const fd = new FormData(); fd.append("password", p);
  await api("/admin/login", { method: "POST", body: fd });
  pw = p; sessionStorage.setItem("adminpw", p);
  $("#login").style.display = "none"; $("#panel").style.display = "";
  loadList();
}
$("#go").onclick = async () => {
  try { await login($("#pw").value); }
  catch (e) { $("#loginmsg").textContent = "비밀번호가 다릅니다."; }
};
$("#pw").onkeydown = e => { if (e.key === "Enter") $("#go").click(); };
$("#logout").onclick = () => { sessionStorage.removeItem("adminpw"); location.reload(); };
$("#reload").onclick = () => loadList();
$("#showdel").onchange = () => loadList();

const FLAG = { deleted: "폐기됨", used: "사용됨", submitted: "제출됨" };

async function loadList() {
  const inc = $("#showdel").checked;
  let d;
  try { d = await api(`/admin/sessions?include_deleted=${inc}`, auth()); }
  catch (e) { $("#list").textContent = "불러오기 실패: " + e; return; }
  if (!d.sessions.length) { $("#list").innerHTML = '<div class="hint">아직 세션이 없습니다.</div>'; return; }
  $("#list").innerHTML = `<table><tr><th>세션</th><th>만든 때</th><th>상태</th>
      <th>사진</th><th>음성</th><th>사별</th></tr>` +
    d.sessions.map(s => `<tr class="click" data-id="${esc(s.session_id)}">
      <td><b>${esc(s.session_id)}</b></td><td>${esc((s.created_at || "").replace("T", " "))}</td>
      <td>${esc(FLAG[s.status] || s.status)}</td>
      <td>${s.has_image ? "○" : "-"}</td><td>${s.has_voice ? "○" : "-"}</td>
      <td>${s.bereavement_weeks == null ? "-" : esc(s.bereavement_weeks) + "주"}</td></tr>`).join("") +
    "</table>";
  document.querySelectorAll("tr.click").forEach(tr =>
    tr.onclick = () => showDetail(tr.dataset.id));
}

const MODEL = { stub: "생성 안 함(키 없음)", queued: "대기 중", processing: "만드는 중",
                ready: "완성", failed: "실패" };

// 설문 v2 표시용 이름. 저장 자료의 필드 이름과 화면 문구를 분리해 둔다.
const SECTION = { background: "4-10 지내던 지역·하셨던 일", shared_memory: "5-1 함께한 추억",
  preference: "5-2 취향·습관", person: "5-3 함께 아는 사람",
  place_activity: "5-4 장소·활동", about_user: "5-5 그분이 알던 나",
  news: "6-4 새로 전할 소식" };
const STATE = { answered: "", unknown: "모름", declined: "답하고 싶지 않음", none: "실제로 없음" };
// 4-11·4-12 떠나신 경위. 'AI 전달 제외'로 두어도 저장된 원문은 여기서 보인다.
const PASSING_MENTION = { on_request: "본인이 꺼낼 때만", exclude_ai: "AI 전달 제외" };
const CERT = { exact: "정확히 기억함", approximate: "대략 기억함", unsure: "확실하지 않음" };
const MENTION = { proactive: "먼저 언급 가능", on_request: "본인이 꺼낼 때만", exclude_ai: "AI 전달 제외" };
const FORM = { informal: "반말", formal: "존댓말", mixed: "섞어 쓰심", unknown: "잘 모름" };
const FIELD = { time: "시점", place: "장소", people: "함께 있던 사람", quote: "실제로 하신 말",
  category: "분류", relation_to_person: "그분과의 관계", relation_to_user: "나와의 관계",
  subject: "대상" };

function cardText(card) {
  const parts = [card.content];
  for (const key of ["category", "subject", "time", "place", "people", "relation_to_person",
                     "relation_to_user", "quote"])
    if (card[key]) parts.push(`${FIELD[key]} ${card[key]}`);
  if (card.certainty) parts.push(CERT[card.certainty] || card.certainty);
  parts.push(MENTION[card.mention_policy] || card.mention_policy);
  return parts.join(" · ");
}

// v1 행은 그대로 읽고 자동 변환하지 않는다. 두 형식을 한 화면에서 구분해 보여준다.
function surveyRows(payload, row) {
  if (payload.survey_schema_version !== 2) {
    return row("설문 형식", "v1 (이전 화면)") +
      row("관계", payload.relation) + row("성별", payload.sex) +
      row("그분 호칭", payload.honorific) + row("나를 부르던 말", payload.calls_user) +
      row("내 이름", payload.user_name) +
      row("성격", (payload.personality_traits || []).join(", ")) +
      row("말버릇", (payload.speech_quirks || []).join(" / ")) +
      row("추억", (payload.shared_memories || []).join("\n")) +
      row("그리운 순간", payload.missed_moment) +
      row("못다 한 말", payload.unsaid_words) + row("듣고 싶은 말", payload.wished_to_hear) +
      row("대화 톤", payload.tone_setting);
  }
  const a = payload.answers || {}, p = a.person || {}, sp = a.speech || {},
        h = a.heart || {}, c = a.care || {}, snap = payload.compiled_snapshot || {};
  let out = row("설문 형식", "v2 (현재 화면)") +
    row("관계", p.relation) + row("성별", p.sex) +
    row("그분 이름", p.person_name) + row("내가 부르던 말", p.user_calls_person) +
    row("나를 부르던 말", p.person_calls_user) + row("내 이름", p.user_name) +
    row("기억 속 시기", p.era) + row("성격", (p.traits || []).join(", ")) +
    row("자주 하시던 말", (p.quirks || []).join(" / ")) +
    row("말투", FORM[sp.form] || sp.form) + row("말투가 달라지는 상황", sp.mixed_note) +
    row("사투리·말씨", sp.dialect) +
    row("실제 대사", (sp.samples || []).map(r =>
      `${r.situation ? r.situation + ": " : ""}${r.line} · ${CERT[r.certainty] || r.certainty}`).join("\n")) +
    row("대화 톤", sp.tone_setting);
  for (const [kind, label] of Object.entries(SECTION)) {
    const item = (a.sections || {})[kind];
    if (!item) continue;
    out += row(label, item.state === "answered"
      ? (item.cards || []).map(cardText).join("\n") : STATE[item.state] || item.state);
  }
  // `passing` 이 없는 기존 v2 행은 이 줄을 그리지 않는다. 자동으로 채우지 않는다.
  const pass = a.passing;
  if (pass) {
    out += row("4-11 떠나신 경위", pass.state === "answered"
      ? [pass.cause, pass.time ? "시점 " + pass.time : "",
         PASSING_MENTION[pass.mention_policy] || pass.mention_policy]
        .filter(Boolean).join(" · ")
      : STATE[pass.state] || pass.state);
  }
  out += row("그리운 순간", h.missed_moment) + row("못다 한 말", h.unsaid_words) +
    row("듣고 싶은 말", h.wished_to_hear) + row("먼저 꺼내지 않을 주제", c.avoid_topics) +
    row("바라는 반응", c.preferences) +
    row("변환기 버전", snap.compiler_version) +
    row("설문 해시", snap.survey_revision) + row("확인 해시", snap.preview_revision) +
    row("등록한 인물(persona)", snap.persona) +
    row("등록한 사전지식(knowledge)", snap.knowledge) +
    row("등록한 추가 규칙(rules)", snap.rules);
  return out;
}

async function showDetail(sid) {
  let s;
  try { s = await api(`/admin/session/${encodeURIComponent(sid)}`, auth()); }
  catch (e) { return; }
  const P = s.payload || {};
  const row = (k, v) => v ? `<tr><th style="width:150px">${esc(k)}</th>
      <td style="white-space:pre-wrap">${esc(v)}</td></tr>` : "";
  $("#detail").style.display = "";
  $("#detail").innerHTML = `
    <h2>${esc(sid)}</h2>
    <table>
      ${surveyRows(P, row)}
      ${row("동의", `사진 ${s.consent_image ? "○" : "×"} · 음성 ${s.consent_voice ? "○" : "×"} · 이해 ${s.consent_understand ? "○" : "×"}`)}
      ${row("사별", s.bereavement_weeks == null ? "" : s.bereavement_weeks + "주 전")}
      ${row("3D 모델", (MODEL[s.model_status] || s.model_status) + (s.model_error ? ` — ${s.model_error}` : ""))}
    </table>
    <div class="row" style="margin-top:16px">
      <button class="ghost" data-dl="survey">설문 JSON</button>
      ${s.has_image_file ? '<button class="ghost" data-dl="image">사진</button>' : ""}
      ${s.has_voice_file ? '<button class="ghost" data-dl="voice">음성</button>' : ""}
      ${s.model_status === "ready" ? '<button class="ghost" data-dl="model">model.glb</button>' : ""}
    </div>
    <div class="row" style="margin-top:12px">
      ${s.has_image ? '<button data-act="retry">3D 모델 다시 시도</button>' : ""}
      ${s.status !== "used" ? '<button class="ghost" data-act="used">사용됨으로 표시</button>' : ""}
    </div>
    <div class="warn" style="margin-top:16px">아래는 되돌릴 수 없습니다.</div>
    <div class="row">
      ${s.status !== "deleted" ? '<button class="ghost" data-act="purge">자료 폐기 (기록은 남김)</button>' : ""}
      <button class="ghost" data-act="hard">영구 삭제 (기록까지)</button>
    </div>
    <div class="hint" id="actmsg"></div>`;

  $("#detail").querySelectorAll("[data-dl]").forEach(b => b.onclick = async () => {
    const r = await fetch(`/admin/asset/${encodeURIComponent(sid)}/${b.dataset.dl}`, auth());
    if (!r.ok) { $("#actmsg").textContent = "내려받기 실패"; return; }
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a");
    a.href = url; a.download = `${sid}_${b.dataset.dl}`; a.click();
    URL.revokeObjectURL(url);
  });
  $("#detail").querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    const act = b.dataset.act;
    const danger = { purge: "이 세션의 사진·음성·설문 내용을 지웁니다.",
                     hard: "기록까지 통째로 지웁니다." }[act];
    if (danger && !confirm(`${sid} — ${danger} 되돌릴 수 없습니다.`)) return;
    const fd = new FormData();
    fd.append("password", pw); fd.append("session", sid); fd.append("action", act);
    try {
      const d = await api("/admin/action", { method: "POST", body: fd });
      $("#actmsg").textContent = "완료" + (d.result ? ` — ${d.result}` : "");
      loadList();
      if (act === "hard") $("#detail").style.display = "none"; else showDetail(sid);
    } catch (e) { $("#actmsg").textContent = "실패: " + e; }
  });
}

if (pw) login(pw).catch(() => { sessionStorage.removeItem("adminpw"); });
</script>
</body>
</html>
