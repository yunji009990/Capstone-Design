name: Offline checks

on:
  push:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.claude/**'
      - '.github/workflows/checks.yml'
      - 'Server/**'
      - 'Survey/**'
      - 'Web/**'
      - 'tools/**'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.claude/**'
      - '.github/workflows/checks.yml'
      - 'Server/**'
      - 'Survey/**'
      - 'Web/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          # 모의 검사에는 Unity 대형 에셋·Library가 필요 없다.
          sparse-checkout: |
            Server
            Survey
            Web
            tools
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: Server/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r Server/requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run offline checks
        run: python tools/check.py --area all --python python --output tools/_work/checks/ci
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-${{ matrix.os }}-py${{ matrix.python }}
          path: tools/_work/checks/ci/
          if-no-files-found: warn
          retention-days: 7
