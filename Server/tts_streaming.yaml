# vLLM-Omni 0.26.0 Qwen3-TTS Base: 음성 생성과 파형 디코딩을 동시에 수행한다.
# 공용 96 GB GPU 기준 합계 약 9.6 GB 예산. 다른 GPU에서는 여유 메모리로 재산정한다.
async_chunk: true
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.001
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      # 12 Hz codec. 첫 4프레임 뒤에도 작은 청크를 유지해 재생 중 공백을 줄인다.
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 8
      codec_left_context_frames: 72
stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.07
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 512
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 600
      min_tokens: 2
      repetition_penalty: 1.05
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0
  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.03
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0
